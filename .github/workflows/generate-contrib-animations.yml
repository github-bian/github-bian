name: Generate Contribution Animations

on:
  schedule:
    - cron: "28 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-animations:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake contribution SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D contribution graph
        run: |
          mkdir -p dist
          if [ -f profile-3d-contrib/profile-gitblock.svg ]; then
            cp profile-3d-contrib/profile-gitblock.svg dist/profile-3d-contrib.svg
          elif [ -f profile-3d-contrib/profile-green-animate.svg ]; then
            cp profile-3d-contrib/profile-green-animate.svg dist/profile-3d-contrib.svg
          else
            first_svg="$(find profile-3d-contrib -type f -name '*.svg' | head -n 1)"
            test -n "$first_svg"
            cp "$first_svg" dist/profile-3d-contrib.svg
          fi

      - name: Deploy generated SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
